<path d="M597 299H663" stroke="#8795A0" stroke-width="5"/><rect x="566" y="286" width="55" height="117" rx="5" fill="#F2B486"/><rect x="574" y="294" width="39" height="101" fill="#503A4F"/><g stroke="#FFD1AE" stroke-width="3"><path d="M587 309V380M600 316V375"/></g>
