<rect x="21" y="387" width="126" height="69" rx="3" fill="#F6A679" opacity=".86"/><rect x="31" y="397" width="108" height="50" fill="#23354D"/><path d="M31 417H139M85 397V447" stroke="#EFB998" stroke-width="3"/>
