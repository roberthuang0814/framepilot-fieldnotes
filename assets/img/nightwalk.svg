<rect x="205" y="281" width="51" height="179" rx="5" fill="#F58F87"/><rect x="213" y="289" width="35" height="164" rx="2" fill="#462D49"/>
<path d="M230 307V435" stroke="#FDB9A2" stroke-width="4" stroke-dasharray="15 10"/>
<path d="M230 460V555" stroke="#AF9A8C" stroke-width="4"/>
