<svg width="800" height="920" viewBox="0 0 800 920" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">夜色中的城市與街道</title>
<desc id="desc">深藍色天空、橘色霓虹街燈、店面與雨後反光的風格化插畫</desc>
<defs>
  <linearGradient id="sky" x1="90" y1="20" x2="700" y2="920" gradientUnits="userSpaceOnUse"><stop stop-color="#112D52"/><stop offset="0.45" stop-color="#24355B"/><stop offset="1" stop-color="#BA5D4C"/></linearGradient>
  <linearGradient id="road" x1="400" y1="525" x2="400" y2="920" gradientUnits="userSpaceOnUse"><stop stop-color="#263144"/><stop offset="1" stop-color="#0B1C31"/></linearGradient>
  <linearGradient id="buildL" x1="0" y1="200" x2="340" y2="700" gradientUnits="userSpaceOnUse"><stop stop-color="#16233C"/><stop offset="1" stop-color="#11182E"/></linearGradient>
  <linearGradient id="buildR" x1="480" y1="240" x2="800" y2="700" gradientUnits="userSpaceOnUse"><stop stop-color="#2B314F"/><stop offset="1" stop-color="#171C34"/></linearGradient>
  <linearGradient id="reflection" x1="390" y1="595" x2="400" y2="920" gradientUnits="userSpaceOnUse"><stop stop-color="#FFB27A" stop-opacity=".55"/><stop offset="1" stop-color="#FFB27A" stop-opacity="0"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#FFC38E" stop-opacity=".58"/><stop offset="1" stop-color="#FFC38E" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="19"/></filter>
</defs>
<rect width="800" height="920" fill="url(#sky)"/>
<circle cx="586" cy="170" r="142" fill="url(#glow)"/>
<circle cx="586" cy="170" r="28" fill="#FFCFAB"/>
<g opacity=".6" fill="#A6C2D7"><circle cx="160" cy="98" r="1.7"/><circle cx="292" cy="162" r="1"/><circle cx="400" cy="101" r="1.8"/><circle cx="702" cy="87" r="1.4"/><circle cx="735" cy="259" r="1.5"/><circle cx="352" cy="230" r="1.3"/></g>
<!-- horizon city -->
<path d="M0 492H82V405H116V445H151V377H182V430H228V389H251V464H302V402H329V458H377V415H401V478H452V412H480V469H531V391H570V455H622V400H651V459H707V415H741V455H800V620H0V492Z" fill="#202D48"/>
<g fill="#D8A579" opacity=".55"><rect x="97" y="430" width="9" height="12"/><rect x="164" y="396" width="9" height="13"/><rect x="241" y="412" width="6" height="16"/><rect x="309" y="428" width="9" height="13"/><rect x="544" y="423" width="12" height="14"/><rect x="633" y="424" width="10" height="13"/><rect x="725" y="433" width="8" height="16"/></g>
